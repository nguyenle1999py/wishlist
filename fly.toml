# fly.toml app configuration file generated for wishlist-zsgabw on 2026-10-25T10:30:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wishlist-zsgabw'
primary_region = 'sin'

[build]

[env]
  DATABASE_PATH = '/data/wishlist.db'
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8765'
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'wishlist_data'
  destination = '/data'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
